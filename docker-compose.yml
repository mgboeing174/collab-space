services:
  collabspace:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: collabspace
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - JWT_SECRET=change-this-to-a-secure-random-secret-in-production
    volumes:
      # Persistent SQLite database mount
      - collabspace-data:/app/server/data

volumes:
  collabspace-data:
    driver: local
